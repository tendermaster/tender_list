      "Type": "Line-interactive"
      "Phase": "Single phase"
      "Backup time": "Typically 10–30 min at small load"
      "Battery": "Internal sealed battery"
      "Typical load": "1 PC and accessories"
  - key: online-ups-1-3-kva
    name: "Online UPS 1–3 kVA"
    summary: "For small server rooms, labs, clinics and sensitive equipment that needs clean, uninterrupted power."
    attributes:
      "Capacity": "1–3 kVA"
      "Type": "Online double conversion"
      "Phase": "Single phase"
      "Backup time": "Varies by battery bank"
      "Battery": "Internal or external battery pack"
      "Typical load": "Servers, network racks, lab equipment"
  - key: online-ups-5-10-kva
    name: "Online UPS 5–10 kVA"
