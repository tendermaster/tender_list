    name: "Mid-range business desktop"
    summary: "For accounts, ERP, multitasking and lab or reception use that needs a smoother, longer-lasting machine."
    attributes:
      "Processor": "Core i5 / Ryzen 5 class"
      "RAM": "8–16 GB"
      "Storage": "512 GB–1 TB SSD"
      "Graphics": "Integrated"
      "Form factor": "Tower or small tower"
      "Typical use": "Accounts, ERP, multitasking"
