    attributes:
      "Capacity": "5–10 kVA"
      "Type": "Online double conversion"
      "Phase": "Single or three phase input"
      "Backup time": "Varies by battery bank"
      "Battery": "External battery bank"
      "Typical load": "Office floors, diagnostic equipment"
  - key: three-phase-online-ups
    name: "Three-phase online UPS"
    summary: "For data centres, server rooms and plants that run three-phase equipment and need high-capacity protection."
    attributes:
      "Capacity": "10 kVA and above"
      "Type": "Online double conversion"
