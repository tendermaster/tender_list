cctv-cameras-recorders:
  - key: indoor-ip-dome
    name: "Indoor IP dome camera"
    summary: "For offices, classrooms, corridors and shops where a discreet, ceiling-mounted camera is needed."
    attributes:
      "Resolution": "2–5 MP"
      "Lens / view": "Fixed, about 2.8–4 mm"
      "Night vision": "Up to 20–30 m IR"
      "Weather rating": "Indoor use"
      "Power": "PoE or 12 V DC"
      "Recording": "Via NVR; optional SD card"
  - key: outdoor-ip-bullet
    name: "Outdoor IP bullet camera"
    summary: "For gates, boundary walls, parking areas and building entrances that need weatherproof coverage."
    attributes:
      "Resolution": "2–8 MP"
      "Lens / view": "Fixed, about 2.8–6 mm"
      "Night vision": "Up to 30–60 m IR"
      "Weather rating": "IP66–IP67"
      "Power": "PoE or 12 V DC"
      "Recording": "Via NVR; optional SD card"
  - key: ptz-camera
    name: "PTZ camera"
    summary: "For large open areas such as campuses, yards and plants where one camera must pan, tilt and zoom."
    attributes:
      "Resolution": "2–4 MP"
      "Lens / view": "Motorised zoom, 4x–30x"
      "Night vision": "Up to 50–150 m IR"
      "Weather rating": "IP66 and above"
      "Power": "PoE+, 24 V AC or 12 V DC"
      "Recording": "Via NVR; optional SD card"
  - key: eight-camera-nvr-kit
    name: "8-camera system with NVR"
    summary: "A complete kit for a small office, school wing or factory floor, with cameras, NVR, hard disk and cabling."
    attributes:
      "Resolution": "2–5 MP per camera"
      "Lens / view": "Mix of dome and bullet"
      "Night vision": "Up to 30 m IR typical"
      "Weather rating": "Indoor and outdoor mix"
      "Power": "PoE switch or central supply"
      "Recording": "8-channel NVR, 1–4 TB disk"
  - key: wireless-4g-camera
    name: "Wireless / 4G camera"
    summary: "For remote sites, construction sites and rented premises without wired network or easy cabling."
    attributes:
      "Resolution": "2–4 MP"
      "Lens / view": "Fixed or pan-tilt"
      "Night vision": "Up to 10–30 m IR or colour"
      "Weather rating": "Indoor or IP65 and above"
      "Power": "Mains adapter; solar optional"
      "Recording": "SD card and cloud; SIM or Wi-Fi"

desktop-computers:
