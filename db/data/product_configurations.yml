      "Storage": "1 TB+ SSD, optional extra HDD"
      "Graphics": "Dedicated professional or gaming GPU"
      "Form factor": "Full tower"
      "Typical use": "CAD, design, editing"
  - key: mini-pc
    name: "Small-form-factor / mini PC"
