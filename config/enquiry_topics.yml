# Native enquiry forms (/enquiry/<key>), replacing the Google Forms. Each topic:
#   title, intro, submit (button label)
#   contact: extra contact fields besides name, email and mobile (company,
#     designation, website); a trailing ! makes one required
#   fields: key, label, type (short, paragraph, choice, checkboxes),
#     required, options, hint
#   form: false for topics filled in elsewhere (no /enquiry page)
# Answers are saved on the Lead (kind enquiry) and shown in /admin/leads.
---
- key: rfq
